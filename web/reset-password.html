<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007FFF">
  <title>Reset password | MediTrack</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f7fafc;
      color: #172033;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 10% 10%, rgba(0, 127, 255, 0.12), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(20, 184, 166, 0.10), transparent 30%),
        #f7fafc;
    }

    .shell { width: min(100%, 440px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      color: #007fff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: #007fff;
      box-shadow: 0 9px 22px rgba(0, 127, 255, 0.28);
    }

    .cross {
      position: relative;
      width: 23px;
      height: 23px;
    }

    .cross::before,
    .cross::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 22px;
      height: 7px;
      border-radius: 3px;
      background: white;
      transform: translate(-50%, -50%);
    }

    .cross::after { transform: translate(-50%, -50%) rotate(90deg); }

    .card {
      padding: 34px;
      border: 1px solid #e5eaf1;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 20px 55px rgba(28, 49, 77, 0.12);
    }

    h1 {
      margin: 0 0 9px;
      font-size: 25px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
    }

    .account {
      margin-top: -12px;
      color: #334155;
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .account strong { color: #007fff; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .password-field { position: relative; }

    input {
      width: 100%;
      min-height: 50px;
      padding: 12px 48px 12px 14px;
      border: 1px solid #ccd5e0;
      border-radius: 11px;
      outline: none;
      background: white;
      color: #172033;
      font: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: #007fff;
      box-shadow: 0 0 0 4px rgba(0, 127, 255, 0.12);
    }

    .toggle {
      position: absolute;
      top: 50%;
      right: 9px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      padding: 8px;
    }

    .hint {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 12px;
    }

    .primary {
      width: 100%;
      min-height: 50px;
      margin-top: 24px;
      border: 0;
      border-radius: 11px;
      background: #007fff;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      box-shadow: 0 8px 20px rgba(0, 127, 255, 0.22);
    }

    .primary:hover { background: #006fdf; }
    .primary:disabled { cursor: wait; opacity: 0.65; }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }

    .message.success {
      display: block;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .loading { text-align: center; color: #64748b; }

    .spinner {
      width: 32px;
      height: 32px;
      margin: 4px auto 15px;
      border: 3px solid #dbeafe;
      border-top-color: #007fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 18px;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      body { padding: 16px; }
      .card { padding: 27px 21px; border-radius: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="MediTrack">
      <span class="logo" aria-hidden="true"><span class="cross"></span></span>
      MediTrack
    </div>

    <section class="card">
      <div id="loading" class="loading">
        <div class="spinner" aria-hidden="true"></div>
        Checking your reset link&hellip;
      </div>

      <div id="reset-view" hidden>
        <h1>Create a new password</h1>
        <p class="subtitle">Choose a strong password you have not used before.</p>
        <p class="account">Resetting the password for <strong id="email"></strong></p>

        <form id="reset-form" novalidate>
          <label for="password">New password</label>
          <div class="password-field">
            <input id="password" type="password" autocomplete="new-password" minlength="6" required>
            <button class="toggle" type="button" data-target="password">SHOW</button>
          </div>
          <p class="hint">Use at least 6 characters.</p>

          <label for="confirm-password">Confirm new password</label>
          <div class="password-field">
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
            <button class="toggle" type="button" data-target="confirm-password">SHOW</button>
          </div>

          <button id="submit" class="primary" type="submit">Update password</button>
          <div id="form-message" class="message" role="alert" aria-live="polite"></div>
        </form>
      </div>

      <div id="result-view" hidden>
        <h1 id="result-title"></h1>
        <p id="result-text" class="subtitle"></p>
        <div id="result-message" class="message" role="alert"></div>
      </div>
    </section>

    <p class="footer">Secure account recovery powered by MediTrack</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZXpzKJFfWPpSMpe9tWiFoy0yL_oF_fvo",
      authDomain: "meditrack-gr05.firebaseapp.com",
      projectId: "meditrack-gr05",
      appId: "1:914871814119:web:de08191ec3ac4432c3df42"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const actionCode = params.get("oobCode");

    const loading = document.getElementById("loading");
    const resetView = document.getElementById("reset-view");
    const resultView = document.getElementById("result-view");
    const form = document.getElementById("reset-form");
    const formMessage = document.getElementById("form-message");
    const submit = document.getElementById("submit");

    function showResult(title, text, type) {
      loading.hidden = true;
      resetView.hidden = true;
      resultView.hidden = false;
      document.getElementById("result-title").textContent = title;
      document.getElementById("result-text").textContent = text;
      const message = document.getElementById("result-message");
      message.className = `message ${type}`;
      message.textContent = type === "success"
        ? "You can close this page and sign in to MediTrack with your new password."
        : "Request a new reset email from the MediTrack sign-in screen.";
    }

    function friendlyError(error) {
      switch (error?.code) {
        case "auth/weak-password":
          return "That password is too weak. Please choose a stronger password.";
        case "auth/expired-action-code":
          return "This password reset link has expired.";
        case "auth/invalid-action-code":
          return "This password reset link is invalid or has already been used.";
        default:
          return "We could not update your password. Please try again.";
      }
    }

    async function initialize() {
      if (mode !== "resetPassword" || !actionCode) {
        showResult("Invalid reset link", "This link is missing required information.", "error");
        return;
      }

      try {
        const email = await verifyPasswordResetCode(auth, actionCode);
        document.getElementById("email").textContent = email;
        loading.hidden = true;
        resetView.hidden = false;
        document.getElementById("password").focus();
      } catch (error) {
        showResult("Reset link unavailable", friendlyError(error), "error");
      }
    }

    document.querySelectorAll(".toggle").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "HIDE" : "SHOW";
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirm-password").value;

      formMessage.className = "message";
      formMessage.textContent = "";

      if (password.length < 6) {
        formMessage.className = "message error";
        formMessage.textContent = "Your password must contain at least 6 characters.";
        return;
      }

      if (password !== confirmation) {
        formMessage.className = "message error";
        formMessage.textContent = "The two passwords do not match.";
        return;
      }

      submit.disabled = true;
      submit.textContent = "Updating password...";

      try {
        await confirmPasswordReset(auth, actionCode, password);
        showResult(
          "Password updated",
          "Your account is secure and your new password is ready to use.",
          "success"
        );
      } catch (error) {
        formMessage.className = "message error";
        formMessage.textContent = friendlyError(error);
        submit.disabled = false;
        submit.textContent = "Update password";
      }
    });

    initialize();
  </script>
</body>
</html>
